networks:
  dev:

services:

  nginx:
    image: nginx:alpine-slim
    ports:
      - "80:80"
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    depends_on:
      - server
      - client
    networks:
      - dev

  server:
    build:
      context: ./server
    networks:
      - dev

  client:
    build:
      context: ./client
    networks:
      - dev