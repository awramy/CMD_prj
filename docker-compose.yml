version: '3'
services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build: ./client
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server