version: '3'
services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules
    command: npm start
    depends_on:
      - mongo

  client:
    build: ./client
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - server

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

volumes:
  mongo-data: