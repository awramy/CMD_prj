server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;


    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location ~ \.js$ {
        add_header Content-Type application/javascript;
    }

    location ~ \.css$ {
        add_header Content-Type text/css;
    }
}